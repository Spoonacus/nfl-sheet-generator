<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncle's Exact NFL Pick'em Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 20px; background: #f4f6f8; color: #1a1a1a; }
    .card { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: 14px; }
    select, input, button { width: 100%; padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #013369; color: white; border: none; font-weight: 600; cursor: pointer; margin-top: 16px; }
    button:hover { background: #002244; }
    button.secondary { background: #d50a0a; margin-top: 10px; }
    button.secondary:hover { background: #a80808; }
    #status { margin-top: 16px; font-size: 14px; color: #333; white-space: pre-line; }
  </style>
</head>
<body>
  <div class="card">
    <h2>NFL Pick'em Exact XML Generator</h2>
    
    <label for="seasonYear">NFL Season Year</label>
    <input type="number" id="seasonYear" value="2026" />

    <label for="playerRows">Blank Player Rows (Uncle's Week 9 has 6)</label>
    <input type="number" id="playerRows" value="6" />

    <label for="singleWeek">Single Week Download</label>
    <select id="singleWeek">
      <option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option>
      <option value="4">Week 4</option><option value="5">Week 5</option><option value="6">Week 6</option>
      <option value="7">Week 7</option><option value="8">Week 8</option><option value="9">Week 9</option>
      <option value="10" selected>Week 10</option><option value="11">Week 11</option><option value="12">Week 12</option>
      <option value="13">Week 13</option><option value="14">Week 14</option><option value="15">Week 15</option>
      <option value="16">Week 16</option><option value="17">Week 17</option><option value="18">Week 18</option>
    </select>

    <button onclick="generateSingleWeek()">Download Selected Week (.xlsx)</button>
    <button class="secondary" onclick="generateFullSeasonZip()">Download All 18 Weeks (.zip of 18 .xlsx files)</button>

    <div id="status">Ready. Uses Uncle's exact raw XML column widths (2.828125 & 0.26953125).</div>
  </div>

  <script>
    // Convert 1-based column index to Excel column letter (1 -> A, 27 -> AA, 46 -> AT)
    function colLetter(colIdx) {
      let temp, letter = '';
      while (colIdx > 0) {
        temp = (colIdx - 1) % 26;
        letter = String.fromCharCode(temp + 65) + letter;
        colIdx = (colIdx - temp - 1) / 26;
      }
      return letter;
    }

    function escapeXml(unsafe) {
      return String(unsafe).replace(/[<>&'"]/g, c => ({
        '<': '&lt;', '>': '&gt;', '&': '&amp;', '\'': '&apos;', '"': '&quot;'
      }[c]));
    }

    async function fetchWeekMatchups(year, week) {
      const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${year}&seasontype=2&week=${week}`;
      const res = await fetch(url);
      const data = await res.json();
      const events = data.events || [];

      // Sort chronologically by kickoff time so Monday Night Football is always last
      events.sort((a, b) => new Date(a.date) - new Date(b.date));

      return events.map(ev => {
        const comp = ev.competitions[0];
        const away = comp.competitors.find(c => c.homeAway === "away").team.shortDisplayName;
        const home = comp.competitors.find(c => c.homeAway === "home").team.shortDisplayName;
        return { away, home };
      });
    }

    // Builds an exact byte-for-byte structural clone of Uncle's NFL Week 9.xlsx
    async function buildExactXlsxBlob(week, matchups, playerRows) {
      const zip = new JSZip();
      const numGames = matchups.length;
      const tieCol = 3 * numGames + 1; // 1-based: Col A=1, 15 games -> AT=46, 16 games -> AW=49
      const maxCol = tieCol + 2;       // Matches AU & AV trailing columns in Uncle's file
      const totalRows = 2 + playerRows;

      // 1. Build sharedStrings.xml
      const strings = [];
      matchups.forEach(m => {
        strings.push(m.away);
        strings.push(m.home);
      });
      strings.push("Tie Breaker");
      strings.push(`NFL Week ${week}`);

      const sstItems = strings.map(s => `<si><t>${escapeXml(s)}</t></si>`).join("");
      const sharedStringsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${strings.length}" uniqueCount="${strings.length}">${sstItems}</sst>`;

      // 2. Build exact <cols> from Uncle's sheet1.xml
      let colsXml = `<cols>`;
      colsXml += `<col min="1" max="1" width="29.80078125" style="4" bestFit="1" customWidth="1" />`;
      for (let g = 0; g < numGames; g++) {
        const awayCol = 2 + g * 3;
        const homeCol = 3 + g * 3;
        const sepCol  = 4 + g * 3;
        colsXml += `<col min="${awayCol}" max="${homeCol}" width="2.828125" style="4" bestFit="1" customWidth="1" />`;
        if (g < numGames - 1) {
          colsXml += `<col min="${sepCol}" max="${sepCol}" width="0.26953125" style="4" customWidth="1" />`;
        }
      }
      colsXml += `<col min="${tieCol}" max="${tieCol + 1}" width="2.96484375" style="4" bestFit="1" customWidth="1" />`;
      colsXml += `<col min="${tieCol + 2}" max="16384" width="9.16796875" style="4" />`;
      colsXml += `</cols>`;

      // 3. Build <sheetData> rows
      let sheetDataXml = `<sheetData>`;

      // Row 1 (Height 117, vertical stacked team names)
      sheetDataXml += `<row r="1" spans="1:${maxCol}" ht="117" x14ac:dyDescent="0.1">`;
      sheetDataXml += `<c r="A1" s="1" />`;
      let strIdx = 0;
      for (let g = 0; g < numGames; g++) {
        const awayRef = `${colLetter(2 + g * 3)}1`;
        const homeRef = `${colLetter(3 + g * 3)}1`;
        sheetDataXml += `<c r="${awayRef}" s="2" t="s"><v>${strIdx++}</v></c>`;
        sheetDataXml += `<c r="${homeRef}" s="2" t="s"><v>${strIdx++}</v></c>`;
        if (g < numGames - 1) {
          const sepRef = `${colLetter(4 + g * 3)}1`;
          sheetDataXml += `<c r="${sepRef}" s="2" />`;
        }
      }
      sheetDataXml += `<c r="${colLetter(tieCol)}1" s="3" t="s"><v>${strIdx++}</v></c>`;
      sheetDataXml += `</row>`;

      // Row 2 (Merged "NFL Week X" banner, height 12.75)
      sheetDataXml += `<row r="2" spans="1:${maxCol}" s="5" customFormat="1" ht="12.75" x14ac:dyDescent="0.15">`;
      sheetDataXml += `<c r="A2" s="11" t="s"><v>${strIdx++}</v></c>`;
      for (let c = 2; c < tieCol; c++) {
        sheetDataXml += `<c r="${colLetter(c)}2" s="12" />`;
      }
      sheetDataXml += `<c r="${colLetter(tieCol)}2" s="13" />`;
      sheetDataXml += `</row>`;

      // Rows 3 to totalRows (6 blank player rows by default, height 12.75)
      for (let r = 3; r <= totalRows; r++) {
        sheetDataXml += `<row r="${r}" spans="1:${maxCol}" s="5" customFormat="1" ht="12.75" x14ac:dyDescent="0.15">`;
        sheetDataXml += `<c r="A${r}" s="6" />`;
        for (let c = 2; c <= tieCol; c++) {
          sheetDataXml += `<c r="${colLetter(c)}${r}" s="7" />`;
        }
        sheetDataXml += `<c r="${colLetter(tieCol + 1)}${r}" s="8" />`;
        sheetDataXml += `<c r="${colLetter(tieCol + 2)}${r}" s="8" />`;
        sheetDataXml += `</row>`;
      }
      sheetDataXml += `</sheetData>`;

      const tieColLetter = colLetter(tieCol);
      const maxColLetter = colLetter(maxCol);

      const sheet1Xml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" mc:Ignorable="x14ac xr xr2 xr3" xmlns:x14ac="http://schemas.microsoft.com/office/spreadsheetml/2009/9/ac" xmlns:xr="http://schemas.microsoft.com/office/spreadsheetml/2014/revision" xmlns:xr2="http://schemas.microsoft.com/office/spreadsheetml/2015/revision2" xmlns:xr3="http://schemas.microsoft.com/office/spreadsheetml/2016/revision3"><dimension ref="A1:${maxColLetter}${totalRows}" /><sheetViews><sheetView showGridLines="0" tabSelected="1" zoomScaleNormal="100" workbookViewId="0"><selection activeCell="A3" sqref="A3" /></sheetView></sheetViews><sheetFormatPr defaultColWidth="9.16796875" defaultRowHeight="10.5" x14ac:dyDescent="0.1" />${colsXml}${sheetDataXml}<mergeCells count="1"><mergeCell ref="A2:${tieColLetter}2" /></mergeCells><printOptions horizontalCentered="1" /><pageMargins left="0.2" right="0.05" top="0.51" bottom="0.5" header="0.17" footer="0.5" /><pageSetup scale="85" orientation="landscape" /></worksheet>`;

      // Exact styles.xml from Uncle's NFL Week 9.xlsx
      const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" mc:Ignorable="x14ac x16r2 xr" xmlns:x14ac="http://schemas.microsoft.com/office/spreadsheetml/2009/9/ac" xmlns:x16r2="http://schemas.microsoft.com/office/spreadsheetml/2015/02/main" xmlns:xr="http://schemas.microsoft.com/office/spreadsheetml/2014/revision"><fonts count="6" x14ac:knownFonts="1"><font><sz val="10" /><name val="Arial" /><family val="2" /></font><font><sz val="10" /><name val="Arial" /><family val="2" /></font><font><sz val="8" /><name val="Arial" /><family val="2" /></font><font><sz val="8" /><color indexed="10" /><name val="Arial" /><family val="2" /></font><font><b /><i /><u /><sz val="10" /><name val="Arial" /><family val="2" /></font><font><sz val="10" /><color rgb="FFFF0000" /><name val="Arial" /><family val="2" /></font></fonts><fills count="3"><fill><patternFill patternType="none" /></fill><fill><patternFill patternType="gray125" /></fill><fill><patternFill patternType="solid"><fgColor theme="0" /><bgColor indexed="64" /></patternFill></fill></fills><borders count="5"><border><left /><right /><top /><bottom /><diagonal /></border><border><left style="thin"><color indexed="64" /></left><right style="thin"><color indexed="64" /></right><top style="thin"><color indexed="64" /></top><bottom style="thin"><color indexed="64" /></bottom><diagonal /></border><border><left style="thin"><color indexed="64" /></left><right /><top style="thin"><color indexed="64" /></top><bottom style="thin"><color indexed="64" /></bottom><diagonal /></border><border><left /><right /><top style="thin"><color indexed="64" /></top><bottom style="thin"><color indexed="64" /></bottom><diagonal /></border><border><left /><right style="thin"><color indexed="64" /></right><top style="thin"><color indexed="64" /></top><bottom style="thin"><color indexed="64" /></bottom><diagonal /></border></borders><cellStyleXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" /><xf numFmtId="0" fontId="1" fillId="0" borderId="0" /></cellStyleXfs><cellXfs count="14"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" /><xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" /><xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment textRotation="255" /></xf><xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment textRotation="255" /></xf><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" /><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" /><xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" /></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" /></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" /><xf numFmtId="0" fontId="5" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" /><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" /></xf><xf numFmtId="0" fontId="4" fillId="0" borderId="2" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" /></xf><xf numFmtId="0" fontId="4" fillId="0" borderId="3" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" /></xf><xf numFmtId="0" fontId="4" fillId="0" borderId="4" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" /></xf></cellXfs><cellStyles count="2"><cellStyle name="Normal" xfId="0" builtinId="0" /><cellStyle name="Normal 6" xfId="1" /></cellStyles><dxfs count="0" /><tableStyles count="0" defaultTableStyle="TableStyleMedium2" defaultPivotStyle="PivotStyleLight16" /></styleSheet>`;

      const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><fileVersion appName="xl" lastEdited="7" lowestEdited="7" rupBuild="30625" /><workbookPr defaultThemeVersion="124226" /><bookViews><workbookView xWindow="-96" yWindow="-96" windowWidth="23232" windowHeight="12432" /></bookViews><sheets><sheet name="Week (${week})" sheetId="1" r:id="rId1" /></sheets><calcPr calcId="191028" /></workbook>`;

      const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml" /><Default Extension="xml" ContentType="application/xml" /><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml" /><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml" /><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml" /><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml" /></Types>`;

      const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml" /></Relationships>`;

      const workbookRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml" /><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml" /><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml" /></Relationships>`;

      zip.file("[Content_Types].xml", contentTypesXml);
      zip.file("_rels/.rels", rootRelsXml);
      zip.file("xl/workbook.xml", workbookXml);
      zip.file("xl/_rels/workbook.xml.rels", workbookRelsXml);
      zip.file("xl/worksheets/sheet1.xml", sheet1Xml);
      zip.file("xl/styles.xml", stylesXml);
      zip.file("xl/sharedStrings.xml", sharedStringsXml);

      return await zip.generateAsync({
        type: "blob",
        mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
    }

    async function generateSingleWeek() {
      const year = document.getElementById("seasonYear").value;
      const week = document.getElementById("singleWeek").value;
      const playerRows = parseInt(document.getElementById("playerRows").value, 10) || 6;
      const status = document.getElementById("status");

      status.textContent = `Fetching NFL Week ${week} (${year}) schedule...`;
      const matchups = await fetchWeekMatchups(year, week);
      const blob = await buildExactXlsxBlob(week, matchups, playerRows);

      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `NFL Week ${week}.xlsx`;
      a.click();
      status.textContent = `Downloaded NFL Week ${week}.xlsx (${matchups.length} games, MNF: ${matchups[matchups.length-1].away} vs ${matchups[matchups.length-1].home}).`;
    }

    async function generateFullSeasonZip() {
      const year = document.getElementById("seasonYear").value;
      const playerRows = parseInt(document.getElementById("playerRows").value, 10) || 6;
      const status = document.getElementById("status");
      const masterZip = new JSZip();

      for (let w = 1; w <= 18; w++) {
        status.textContent = `Building exact XML for Week ${w} of 18...`;
        const matchups = await fetchWeekMatchups(year, w);
        if (!matchups.length) continue;
        const blob = await buildExactXlsxBlob(w, matchups, playerRows);
        masterZip.file(`NFL Week ${w}.xlsx`, blob);
      }

      status.textContent = "Zipping all 18 files...";
      const content = await masterZip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(content);
      a.download = `NFL_Pickem_${year}_All_18_Weeks.zip`;
      a.click();
      status.textContent = `Done! Downloaded all 18 weekly files for ${year}.`;
    }
  </script>
</body>
</html>
